name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -count=1
      # short fuzz pass over the spec parser and build/query path
      - run: go test -run xxx -fuzz FuzzParseSpec -fuzztime 15s .
